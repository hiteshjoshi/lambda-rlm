[package]
name = "lambda_rlm"
version = "0.3.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "process"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
blake3 = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
hex = "0.4"
tempfile = "3"
which = "7"
dashmap = "6"
bytes = "1"
regex = "1"
fs4 = "0.8"
portable-pty = "0.8"
memchr = "2"
getrandom = "0.2"

[target.'cfg(not(windows))'.dependencies]
jemallocator = "0.5"

[dev-dependencies]
loom = "0.7"
